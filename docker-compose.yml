# ============================================================
# DevOps Assistant — Docker Compose
# Services: backend · frontend · db · redis · worker · flower
# ============================================================

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql://devops_user:devops_pass@db:5432/devops_assistant}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  ENABLE_HITL: "true"
  DISABLE_AUTH: "false"
  DESKTOP_MODE: "false"

services:

  # ── Database ────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: agentic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops_pass}
      POSTGRES_DB: ${POSTGRES_DB:-devops_assistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devops_net

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agentic-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devops_net

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentic-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
    expose:
      - "8000"
    volumes:
      - ./backend/app/ml:/app/app/ml:ro
      - /var/run/docker.sock:/var/run/docker.sock  # Docker tool integration
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - devops_net

  # ── Celery Worker ───────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentic-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery_app worker --loglevel=info --concurrency=4
    healthcheck:
      test:
        - CMD-SHELL
        - 'celery -A app.core.celery_app:celery_app inspect ping --destination "celery@$$HOSTNAME" --timeout=10'
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
    volumes:
      - ./backend/app/ml:/app/app/ml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devops_net

  # ── Celery Flower (task monitoring UI) ─────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentic-flower
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery_app flower --port=5555 --url-prefix=flower
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5555/flower/healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    env_file:
      - ./backend/.env
    environment:
      <<: *backend-env
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    expose:
      - "5555"
    depends_on:
      - redis
      - celery_worker
    networks:
      - devops_net

  # ── React Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        # This web deployment always uses Nginx's same-origin /api proxy.
        VITE_API_BASE_URL: ""
    container_name: agentic-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - devops_net

volumes:
  postgres_data:
  redis_data:

networks:
  devops_net:
    name: devops_assistant_network
    driver: bridge
