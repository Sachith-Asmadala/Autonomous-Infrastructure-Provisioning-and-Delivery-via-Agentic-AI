name: Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate semantic version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: expected vMAJOR.MINOR.PATCH without leading zeros."
            exit 1
          fi

      - name: Verify release commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag_sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          test "$(git rev-parse HEAD)" = "$tag_sha"
          git merge-base --is-ancestor "$tag_sha" origin/main

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json tagName > /dev/null 2>&1; then
            echo "Release already exists; preserving it without changes."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
