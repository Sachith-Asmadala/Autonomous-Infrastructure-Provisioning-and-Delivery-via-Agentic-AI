name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ══════════════════════════════════════════════════════════════
  # Backend — Lint, Type Check & Test
  # ══════════════════════════════════════════════════════════════
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 mypy

      - name: Lint with flake8
        working-directory: backend
        run: flake8 app --max-line-length=120 --exclude=__pycache__ --statistics

      - name: Type check with mypy
        working-directory: backend
        run: mypy app --ignore-missing-imports --no-error-summary

  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEFAULT_LLM_PROVIDER: test
          MEMORY_BACKEND: database
          DESKTOP_MODE: "false"
          DISABLE_AUTH: "false"
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          GITHUB_TOKEN: ""
          GITHUB_APP_PRIVATE_KEY: ""
        run: pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Test EC2 deployment safety
        run: python -m unittest discover -s scripts/tests -v

  # ══════════════════════════════════════════════════════════════
  # Frontend — Lint, Type Check & Build
  # ══════════════════════════════════════════════════════════════
  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint with ESLint
        working-directory: frontend
        run: npm run lint

      - name: Type check with tsc
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Test deployment CI gate and frontend API defaults
        run: node --test scripts/tests/*.mjs

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    needs: frontend-lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ══════════════════════════════════════════════════════════════
  # Docker — Compose Build (runs after both stacks pass)
  # ══════════════════════════════════════════════════════════════
  docker-build:
    name: Docker — Compose Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers (backend)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-backend
          key: ${{ runner.os }}-buildx-backend-${{ hashFiles('backend/requirements.txt', 'backend/Dockerfile') }}
          restore-keys: ${{ runner.os }}-buildx-backend-

      - name: Cache Docker layers (frontend)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-frontend
          key: ${{ runner.os }}-buildx-frontend-${{ hashFiles('frontend/package-lock.json', 'frontend/Dockerfile') }}
          restore-keys: ${{ runner.os }}-buildx-frontend-

      - name: Create backend .env for compose build
        run: |
          cp backend/.env.example backend/.env
          echo "SECRET_KEY=ci-docker-build-key" >> backend/.env
          echo "OPENAI_API_KEY=sk-test" >> backend/.env

      - name: Build Docker Compose services
        run: docker compose build --parallel

      - name: Smoke test — start services
        run: |
          docker compose config --quiet
          docker compose up -d db redis backend frontend
          docker compose ps
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 180 --max-time 10 http://localhost/ > /dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 180 --max-time 10 http://localhost/api/v1/health

      - name: Tear down
        if: always()
        run: docker compose down -v
