name: Quality Assurance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend regression and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            qa/requirements.txt
      - name: Install backend and QA dependencies
        run: |
          make backend-install
          backend/venv/bin/python -m pip install -r qa/requirements.txt
      - name: Execute isolated backend suite
        run: make qa-backend
      - name: Upload actual backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-backend-${{ github.sha }}
          path: qa/reports/
          if-no-files-found: warn
          retention-days: 90

  browser-security:
    name: Selenium and passive security
    needs: backend
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            qa/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          make backend-install frontend-install
          backend/venv/bin/python -m pip install -r qa/requirements.txt
      - name: Verify Chrome and Docker prerequisites
        run: |
          google-chrome --version
          docker info --format '{{.ServerVersion}}'
      - name: Execute Selenium and controlled security with passive ZAP
        shell: bash
        run: |
          qa_status=0
          backend/venv/bin/python -m qa.run --suite ui-security || qa_status=$?
          case "$qa_status" in
            0) exit 0 ;;
            3)
              echo "::warning title=ZAP baseline findings::QA completed with passive scan warnings. Review summary.md and the uploaded ZAP reports."
              exit 0
              ;;
            *) exit "$qa_status" ;;
          esac
      - name: Publish QA status
        if: always()
        run: |
          if test -f qa/reports/latest/summary.md; then
            cat qa/reports/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Export sanitized checksummed evidence
        if: always()
        run: |
          if test -f qa/reports/latest/summary.json; then
            backend/venv/bin/python -m qa.export_evidence qa/reports/latest qa/published
          fi
      - name: Upload actual browser and security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-browser-security-${{ github.sha }}
          path: |
            qa/reports/
            qa/published/
          if-no-files-found: warn
          retention-days: 90
      # qa.run terminates its owned server in finally, including test failures.
      # No deployment job, production credentials, Docker socket mount or EC2 access.
