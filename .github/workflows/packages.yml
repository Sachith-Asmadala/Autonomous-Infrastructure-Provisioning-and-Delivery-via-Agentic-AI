name: Publish GitHub Packages

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (vMAJOR.MINOR.PATCH)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: packages-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      image_base: ${{ steps.release.outputs.image_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected vMAJOR.MINOR.PATCH without leading zeros."
            exit 1
          fi
          git fetch --no-tags origin main
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          sha=$(git rev-parse "${tag}^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          printf 'sha=%s\ntag=%s\nimage_base=ghcr.io/%s\n' \
            "$sha" "$tag" "$repository" >> "$GITHUB_OUTPUT"

      - name: Require successful main CI for release commit
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.RELEASE_SHA;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'ci.yml', head_sha: sha,
              branch: 'main', event: 'push', per_page: 100
            });
            const runs = data.workflow_runs
              .filter(run => run.head_sha === sha && run.head_branch === 'main' && run.event === 'push')
              .sort((a, b) => b.id - a.id);
            const latest = runs[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              core.setFailed('The tagged commit must have a completed successful CI Pipeline push run on main.');
              return;
            }
            core.info(`Release commit ${sha} passed CI run ${latest.id}.`);

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Preserve existing version images
        id: existing
        env:
          IMAGE: ${{ needs.validate.outputs.image_base }}-${{ matrix.component }}:${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2> "$RUNNER_TEMP/manifest-error"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists; preserving the published version."
          elif grep -Eq 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/manifest-error"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/manifest-error" >&2
            exit 1
          fi

      - name: Build and publish release image
        if: steps.existing.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.validate.outputs.image_base }}-${{ matrix.component }}:${{ needs.validate.outputs.tag }}
            ${{ needs.validate.outputs.image_base }}-${{ matrix.component }}:sha-${{ needs.validate.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.tag }}
          cache-from: type=gha,scope=packages-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=packages-${{ matrix.component }}

      - name: Verify published image
        env:
          IMAGE: ${{ needs.validate.outputs.image_base }}-${{ matrix.component }}:${{ needs.validate.outputs.tag }}
          COMPONENT: ${{ matrix.component }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE"
          package="${GITHUB_REPOSITORY#*/}-$COMPONENT"
          package=$(printf '%s' "$package" | tr '[:upper:]' '[:lower:]')
          gh api "users/${GITHUB_REPOSITORY%/*}/packages/container/$package" \
            --jq '{name, visibility, html_url, repository: .repository.full_name}'
          printf '### %s\n\nPublished and verified %s.\n' "$COMPONENT" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
